# Main configuration for the training pipeline

# Model settings
model:
  name: "cardiffnlp/twitter-xlm-roberta-base-sentiment"
  max_length: 256

# Training hyperparameters
training:
  num_epochs: 500
  learning_rate: 2e-5
  batch_size: 32
  weight_decay: 0.01
  early_stopping_patience: 50
  fp16: true

  # --- Data Augmentation Settings ---
  augmentation:
    enabled: true
    rate: 0.5
    strength: 0.1 