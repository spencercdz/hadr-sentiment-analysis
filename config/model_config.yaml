# Main configuration for the training pipeline

# Model settings  
model_name: "cardiffnlp/twitter-xlm-roberta-base-sentiment"

# Training hyperparameters
training:
  num_epochs: 1000
  learning_rate: 2e-5
  batch_size: 32
  max_length: 256
  weight_decay: 0.01
  early_stopping_patience: 50
  fp16: true

  # --- Data Augmentation Settings ---
  augmentation:
    enabled: true
    rate: 0.3
    strength: 0.15

hub:
  enabled: true
  repo_id: "spencercdz/xlm-roberta-sentiment-requests"
  private: true
  token: null